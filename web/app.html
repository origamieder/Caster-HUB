<title>Speedcubing Caster Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D1330">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Global text scale: normal and 'texto grande' (Aa button) */
:root { --fz: 1.12; }
:root[data-big] { --fz: 1.3; }
/* Layout: app shell — nav rail (left, bottom on phones) + sticky top bar + one scrolling view; profile opens as a right-side drawer. Landscape tablet first. */
/* Palette taken from the championship logo: green #008B3B · orange #F39200 · red #B30D1B · navy #25346C.
   Dark theme sits on the logo's navy; light theme uses navy as ink. Orange is the single accent. */
:root {
  --bg: #0D1330; --panel: #141C40; --panel2: #1B2550; --line: #2B3767; --fg: #EEF1F8; --muted: #9CA6C6; --dim: #66719C;
  --accent: #F39200; --accent-ink: #1E1000; --red: #E8424E; --green: #22B866; --blue: #8EA2EE; --orange: #F39200; --white: #F4F6FA;
  --b-green: #12A04A; --b-orange: #F39200; --b-red: #D3202F; --b-navy: #5A72D0;
  --gold: #E9B949; --silver: #AEB7C4; --bronze: #CC8A5A; --up-bg: rgba(34,184,102,.16); --down-bg: rgba(232,66,78,.16);
  --shadow: 0 12px 40px rgba(0,0,0,.5); --logo-dark: block; --logo-light: none;
  --card: rgba(20, 28, 68, .64); --card-line: rgba(80, 98, 170, .32);
  --bg-grad: radial-gradient(60% 55% at 92% 4%, rgba(243,146,0,.46), transparent 100%),
             radial-gradient(55% 60% at 4% 50%, rgba(0,139,59,.42), transparent 100%),
             radial-gradient(60% 50% at 55% 104%, rgba(179,13,27,.42), transparent 100%),
             radial-gradient(45% 50% at 100% 72%, rgba(90,114,208,.40), transparent 100%),
             radial-gradient(50% 45% at 38% 18%, rgba(110,134,230,.26), transparent 100%),
             linear-gradient(160deg, #1E2E80 0%, #142062 45%, #0F1848 100%);
  --rail-grad: linear-gradient(180deg, #1A2557 0%, #121A3E 100%);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-time: "JetBrains Mono", "Cascadia Mono", Consolas, "Roboto Mono", monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F3F4F9; --panel: #FFFFFF; --panel2: #ECEEF6; --line: #D6DAE8; --fg: #1A2350; --muted: #535D84; --dim: #8D94B2;
  --accent: #B96A00; --accent-ink: #FFFFFF; --red: #B30D1B; --green: #00803A; --blue: #25346C; --orange: #F39200; --white: #FFFFFF;
  --b-green: #008B3B; --b-orange: #F39200; --b-red: #B30D1B; --b-navy: #25346C;
  --gold: #C9971B; --silver: #8C96A5; --bronze: #A8693B; --up-bg: rgba(0,139,59,.12); --down-bg: rgba(179,13,27,.10);
  --shadow: 0 12px 40px rgba(37,52,108,.18); --logo-dark: none; --logo-light: block; color-scheme: light;
  --card: rgba(255,255,255,.76); --card-line: rgba(37,52,108,.14);
  --bg-grad: radial-gradient(60% 55% at 92% 4%, rgba(243,146,0,.32), transparent 100%),
             radial-gradient(55% 60% at 4% 50%, rgba(0,139,59,.24), transparent 100%),
             radial-gradient(60% 50% at 55% 104%, rgba(179,13,27,.20), transparent 100%),
             radial-gradient(45% 50% at 100% 72%, rgba(37,52,108,.20), transparent 100%),
             radial-gradient(50% 45% at 38% 18%, rgba(37,52,108,.10), transparent 100%),
             linear-gradient(160deg, #FFFFFF 0%, #F1F3FA 50%, #E9ECF6 100%);
  --rail-grad: linear-gradient(180deg, #FFFFFF 0%, #F3F5FB 100%); } }
:root[data-theme="light"] {
  --bg: #F3F4F9; --panel: #FFFFFF; --panel2: #ECEEF6; --line: #D6DAE8; --fg: #1A2350; --muted: #535D84; --dim: #8D94B2;
  --accent: #B96A00; --accent-ink: #FFFFFF; --red: #B30D1B; --green: #00803A; --blue: #25346C; --orange: #F39200; --white: #FFFFFF;
  --b-green: #008B3B; --b-orange: #F39200; --b-red: #B30D1B; --b-navy: #25346C;
  --gold: #C9971B; --silver: #8C96A5; --bronze: #A8693B; --up-bg: rgba(0,139,59,.12); --down-bg: rgba(179,13,27,.10);
  --shadow: 0 12px 40px rgba(37,52,108,.18); --logo-dark: none; --logo-light: block; color-scheme: light;
  --card: rgba(255,255,255,.76); --card-line: rgba(37,52,108,.14);
  --bg-grad: radial-gradient(60% 55% at 92% 4%, rgba(243,146,0,.32), transparent 100%),
             radial-gradient(55% 60% at 4% 50%, rgba(0,139,59,.24), transparent 100%),
             radial-gradient(60% 50% at 55% 104%, rgba(179,13,27,.20), transparent 100%),
             radial-gradient(45% 50% at 100% 72%, rgba(37,52,108,.20), transparent 100%),
             radial-gradient(50% 45% at 38% 18%, rgba(37,52,108,.10), transparent 100%),
             linear-gradient(160deg, #FFFFFF 0%, #F1F3FA 50%, #E9ECF6 100%);
  --rail-grad: linear-gradient(180deg, #FFFFFF 0%, #F3F5FB 100%); }
:root[data-theme="dark"] { --logo-dark: block; --logo-light: none; }

html, body { height: 100%; }
body { background-color: var(--bg); background-image: var(--bg-grad); background-attachment: fixed; color: var(--fg); font-family: var(--f-body); font-size: calc(15px * var(--fz)); line-height: 1.4; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .t { font-variant-numeric: tabular-nums; }
.t { font-family: var(--f-time); font-weight: 500; letter-spacing: -.02em; }

.shell { display: grid; grid-template-columns: 84px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; }
.rail { background: var(--rail-grad); border-right: 1px solid var(--card-line); display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding-block: 14px; padding-left: env(safe-area-inset-left, 0px); }
.logo { width: 54px; height: 54px; margin-bottom: 12px; }
.logo img { width: 100%; height: 100%; display: block; }
.lg-dark { display: var(--logo-dark); } .lg-light { display: var(--logo-light); }
.hero { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.hero img { height: 130px; width: auto; max-width: 100%; }
.hero .txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.brandbar { height: 4px; display: grid; grid-template-columns: repeat(4, 1fr); }
.brandbar i:nth-child(1) { background: var(--b-green); } .brandbar i:nth-child(2) { background: var(--b-navy); }
.brandbar i:nth-child(3) { background: var(--b-red); } .brandbar i:nth-child(4) { background: var(--b-orange); }
.navbtn { width: 70px; border: 0; background: none; border-radius: 12px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--muted); font-size: calc(11px * var(--fz)); font-weight: 600; letter-spacing: .02em; cursor: pointer; }
.navbtn svg { width: 24px; height: 24px; }
.navbtn[aria-current="page"] { background: var(--panel2); color: var(--accent); }
.navbtn:hover { color: var(--fg); }
.rail .spacer { flex: 1; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 14px; background: var(--card);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--card-line); padding-block: 10px; padding-left: 20px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; flex-direction: column; justify-content: center; min-width: 0; line-height: 1.1; }
.brand b { font-family: var(--f-display); font-size: calc(26px * var(--fz)); font-weight: 800; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.brand b em { font-style: normal; color: var(--accent); }
.brand span { font-size: calc(12px * var(--fz)); color: var(--muted); white-space: nowrap; }
.gsearch { position: relative; flex: 1; max-width: 560px; margin-left: auto; }
.gsearch input { width: 100%; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel2); padding: 0 16px 0 44px; font-size: calc(15px * var(--fz)); }
.gsearch svg { position: absolute; left: 15px; top: 12px; width: 20px; height: 20px; color: var(--muted); }
.gsearch kbd { position: absolute; right: 12px; top: 11px; font-family: var(--f-time); font-size: calc(11px * var(--fz)); color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.suggest { position: absolute; left: 0; right: 0; top: 50px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; z-index: 20; }
.suggest button { display: flex; width: 100%; align-items: center; gap: 12px; padding: 10px 14px; border: 0; background: none; text-align: left; cursor: pointer; }
.suggest button:hover, .suggest button.on { background: var(--panel2); }
.iconbtn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel2); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }

.view { flex: 1; overflow-y: auto; overflow-x: hidden; padding-block: 18px 40px; padding-left: 20px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: calc(40px * var(--fz)); line-height: 1; }
h2 { font-size: calc(24px * var(--fz)); }
.eyebrow { font-size: calc(11px * var(--fz)); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 16px 0 22px; }
.kpi { background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; padding: 12px 16px; display: flex; align-items: baseline; gap: 10px; }
.kpi b { font-family: var(--f-display); font-size: calc(40px * var(--fz)); line-height: 1; }
.kpi span { color: var(--muted); font-size: calc(13px * var(--fz)); line-height: 1.2; }

/* event cards */
.evgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.evcard { background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; padding: 14px 16px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; }
.evcard::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--evc); }
.evcard:hover { border-color: var(--evc); }
.evcard h3 { font-size: calc(26px * var(--fz)); }
.evcard .fav { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.evcard .fav .name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.evcard .fav .t { font-size: calc(20px * var(--fz)); color: var(--accent); }
.evcard .row { display: flex; justify-content: space-between; gap: 8px; font-size: calc(13px * var(--fz)); color: var(--muted); }
.evcard .row b { color: var(--fg); font-weight: 600; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.evcard .foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

/* pills & chips */
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: calc(11px * var(--fz)); font-weight: 700; letter-spacing: .04em; white-space: nowrap; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.pill.es { background: linear-gradient(180deg, #C8102E 0 25%, #F1BF00 25% 75%, #C8102E 75%); color: #3B0A0A; border: 0; }
.pill.nr { background: var(--red); color: #fff; border: 0; }
.pill.ch { background: var(--accent); color: var(--accent-ink); border: 0; }
.pill.ok { background: var(--up-bg); color: var(--green); border-color: transparent; }
.pill.no { background: var(--down-bg); color: var(--red); border-color: transparent; }
.pill.intl { background: var(--blue); color: #fff; border: 0; }
.pill.new { background: var(--green); color: #fff; border: 0; }
.cc { font-family: var(--f-time); font-size: calc(11px * var(--fz)); font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.cc.es { background: #C8102E; color: #FFD43B; border-color: #C8102E; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.chip { flex: none; height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 600; font-size: calc(14px * var(--fz)); display: inline-flex; align-items: center; gap: 8px; }
.chip i { width: 10px; height: 10px; border-radius: 3px; background: var(--evc); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.toggle { display: inline-flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.toggle button { border: 0; background: none; height: 36px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: calc(14px * var(--fz)); cursor: pointer; color: var(--muted); white-space: nowrap; }
.toggle button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle button[data-v="es"][aria-pressed="true"] { background: #C8102E; color: #FFD43B; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 14px 0; }
.field { height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); padding: 0 12px; min-width: 0; }
select.field { padding-right: 30px; }
.count { color: var(--muted); font-size: calc(13px * var(--fz)); margin-left: auto; }

/* event header */
.evhead { display: grid; grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.evtitle { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-left: 14px; border-left: 6px solid var(--evc); }
.evtitle h1 { font-size: calc(52px * var(--fz)); }
.box { background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.box .big { font-weight: 700; font-size: calc(17px * var(--fz)); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.box .sub { color: var(--muted); font-size: calc(13px * var(--fz)); margin-top: 2px; }

/* table */
.tablewrap { overflow-x: auto; border: 1px solid var(--card-line); border-radius: 14px; background: var(--card); }
table { border-collapse: collapse; width: 100%; min-width: 1040px; }
thead th { position: sticky; top: 0; background: var(--panel2); font-size: calc(11px * var(--fz)); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  padding: 10px 8px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; }
thead th.l { text-align: left; }
thead th.grp { cursor: default; font-size: calc(10px * var(--fz)); letter-spacing: .14em; padding: 6px 8px; border-bottom: 2px solid var(--gc); color: var(--fg); background: var(--panel); }
thead th.sorted { color: var(--accent); }
tbody td { padding: 8px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--panel2); }
tbody tr:last-child td { border-bottom: 0; }
td.l { text-align: left; }
.seed { font-family: var(--f-display); font-size: calc(24px * var(--fz)); font-weight: 800; width: 52px; }
tr.p1 .seed { color: var(--gold); } tr.p2 .seed { color: var(--silver); } tr.p3 .seed { color: var(--bronze); }
.seedes { font-family: var(--f-display); font-size: calc(18px * var(--fz)); font-weight: 700; color: var(--red); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who .nm { font-weight: 700; font-size: calc(15px * var(--fz)); }
.who .meta { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.av { width: 38px; height: 38px; border-radius: 50%; flex: none; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden;
  font-family: var(--f-display); font-weight: 700; font-size: calc(15px * var(--fz)); color: var(--muted); }
.av img { width: 100%; height: 100%; object-fit: cover; }
td .t { font-size: calc(15px * var(--fz)); }
td.key .t { font-size: calc(18px * var(--fz)); font-weight: 700; color: var(--accent); }
.rk { font-size: calc(12px * var(--fz)); color: var(--muted); }
.delta { display: inline-block; min-width: 64px; padding: 3px 8px; border-radius: 8px; font-family: var(--f-time); font-size: calc(13px * var(--fz)); font-weight: 700; }
.delta.up { background: var(--up-bg); color: var(--green); } .delta.down { background: var(--down-bg); color: var(--red); } .delta.flat { color: var(--muted); }
.spark { display: block; }
.tit { font-family: var(--f-display); font-size: calc(20px * var(--fz)); font-weight: 800; color: var(--accent); }
.zero { color: var(--dim); }
.newrow td { color: var(--muted); font-style: italic; cursor: default; }

/* people grid */
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pcard { background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: left; min-width: 0; }
.pcard:hover { border-color: var(--accent); }
.pcard .av { width: 52px; height: 52px; font-size: calc(19px * var(--fz)); }
.pcard .info { min-width: 0; flex: 1; }
.pcard .nm { font-weight: 700; font-size: calc(16px * var(--fz)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; font-size: calc(12px * var(--fz)); color: var(--muted); }
.pcard .stats { display: flex; gap: 14px; margin-top: 6px; font-size: calc(13px * var(--fz)); }
.pcard .stats b { font-family: var(--f-display); font-size: calc(18px * var(--fz)); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fchip { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: calc(13px * var(--fz)); font-weight: 600; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.bigsearch { flex: 1 1 320px; height: 48px; font-size: calc(16px * var(--fz)); border-radius: 24px; padding: 0 20px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(5,8,14,.55); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(880px, 92vw); background-color: var(--bg); background-image: var(--bg-grad); border-left: 1px solid var(--line); z-index: 31; overflow-y: auto; box-shadow: var(--shadow);
  padding-block: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 30px); padding-left: 24px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(40px); opacity: .6; } } }
.phead { display: flex; gap: 18px; align-items: center; }
.phead .av { width: 92px; height: 92px; font-size: calc(32px * var(--fz)); border-width: 3px; }
.phead h1 { font-size: calc(44px * var(--fz)); }
.phead .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; color: var(--muted); }
.close { margin-left: auto; align-self: flex-start; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.tile { background: var(--card); border: 1px solid var(--card-line); border-radius: 12px; padding: 10px 12px; }
.tile b { display: block; font-family: var(--f-display); font-size: calc(32px * var(--fz)); line-height: 1.05; }
.tile span { font-size: calc(12px * var(--fz)); color: var(--muted); }
.medals { display: flex; gap: 10px; align-items: baseline; }
.medals em { font-style: normal; font-family: var(--f-display); font-size: calc(26px * var(--fz)); font-weight: 800; }
.m1 { color: var(--gold); } .m2 { color: var(--silver); } .m3 { color: var(--bronze); }
.sect { margin-top: 20px; }
.sect h2 { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.podlist { display: flex; flex-wrap: wrap; gap: 6px; }
.pod { display: inline-flex; gap: 6px; align-items: center; padding: 5px 10px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); font-size: calc(13px * var(--fz)); }
.pod i { width: 12px; height: 12px; border-radius: 50%; }

/* caster tools: pins, notes, key facts, head-to-head, big text */
.star { border: 0; background: none; cursor: pointer; padding: 2px 4px; color: var(--dim); font-size: calc(22px * var(--fz)); line-height: 1; border-radius: 8px; flex: none; }
.star[aria-pressed="true"], .star:hover { color: var(--accent); }
.pbtns { margin-left: auto; align-self: flex-start; display: flex; align-items: center; gap: 8px; flex: none; }
.pbtns .star { font-size: calc(30px * var(--fz)); }
.mark { color: var(--accent); font-weight: 700; }
.mark.n { color: var(--blue); }
.facts { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 5px; font-size: calc(15px * var(--fz)); }
.facts li::marker { color: var(--accent); }
.notes { display: block; width: 100%; min-height: 88px; resize: vertical; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; font: inherit; color: inherit; }
.iconbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#evtable td.l, #evtable thead th[data-k="name"] { position: sticky; left: 0; z-index: 1; }
#evtable thead th[data-k="name"] { z-index: 2; }

#evtable tbody tr:hover td.l { background: var(--panel2); }

.evcard .row > span { white-space: nowrap; }
.cmp { margin-bottom: 12px; }
.cmp .cmphead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cmp table { min-width: 0; margin-top: 8px; }
.cmp thead th { position: static; background: none; text-transform: none; letter-spacing: 0; font-size: calc(14px * var(--fz)); color: var(--fg); white-space: normal; vertical-align: bottom; }

.cmp tbody tr { cursor: default; }

:root[data-big] body { font-size: calc(17px * var(--fz)); }

:root[data-big] .seedes { font-size: calc(22px * var(--fz)); }
:root[data-big] .rk { font-size: calc(15px * var(--fz)); }
:root[data-big] .pill { font-size: calc(13px * var(--fz)); height: 26px; }
:root[data-big] .cc { font-size: calc(13px * var(--fz)); }
:root[data-big] thead th { font-size: calc(13px * var(--fz)); }
:root[data-big] .eyebrow { font-size: calc(13px * var(--fz)); }
:root[data-big] .box .big { font-size: calc(21px * var(--fz)); }
:root[data-big] .box .sub, :root[data-big] .note, :root[data-big] .evcard .row, :root[data-big] .cmp td.l, :root[data-big] .pcard .line, :root[data-big] .tile span { font-size: calc(15px * var(--fz)); }
:root[data-big] .facts { font-size: calc(19px * var(--fz)); }

@media (max-width: 1180px) { .evgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 980px) { .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .evhead { grid-template-columns: 1fr 1fr; } .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cols3 { grid-template-columns: 1fr; } }

    border-right: 0; border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0,0,0,.18);
    padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

}

}

<script>
const DATA = /*__DATA__*/;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const store = { get(k, d) { try { const v = localStorage.getItem("sch:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("sch:" + k, JSON.stringify(v)); } catch (e) {} } };

const BRAND = ["var(--b-green)", "var(--b-navy)", "var(--b-red)", "var(--b-orange)"];
const EVC = {}; DATA.events.forEach((e, i) => EVC[e.id] = BRAND[i % 4]);
const EVBYID = Object.fromEntries(DATA.events.map(e => [e.id, e]));
const PERS = Object.fromEntries(DATA.persons.map(p => [p.id, p]));
const ROW = {}; DATA.events.forEach(e => e.rows.forEach(r => (ROW[r.id] ||= {})[e.id] = r));
const COUNTRY = {}; DATA.persons.forEach(p => { if (p.country) COUNTRY[p.iso] = p.country; });
DATA.persons.forEach(p => { p.country ||= COUNTRY[p.iso] || p.iso; p._q = norm(p.name + " " + p.id + " " + p.country);
  p._titles = (p.es?.pod || []).filter(x => x[2] === 1).length; p._intl = (p.eu?.pod?.length || 0) + (p.wc?.pod?.length || 0);
  p._medals = p.medals ? p.medals[0] + p.medals[1] + p.medals[2] : 0;
  p._bestSeed = p.seeds ? Math.min(99999, ...Object.values(p.seeds).map(s => s[0] || 99999)) : 99999; });
const ES = { a: "Media", s: "Single" };
const initials = n => n.replace(/\(.*?\)/g, "").trim().split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const av = p => `<span class="av">${p.avatar ? `<img src="${esc(p.avatar)}" alt="" loading="lazy" onerror="this.remove()">` : ""}${esc(initials(p.name))}</span>`;
const avFix = () => document.querySelectorAll(".av").forEach(a => { const img = a.querySelector("img"); if (img) { a.style.color = "transparent"; img.addEventListener("error", () => a.style.color = ""); } });
const cc = iso => `<span class="cc ${iso === "ES" ? "es" : ""}">${esc(iso)}</span>`;
const fmtYears = ys => ys.length ? ys.join(", ") : "—";

function toSec(t) {
  if (!t || t === "—") return null;
  if (t.includes("/")) { const [a, b] = t.split(" ")[0].split("/").map(Number); return -(a - (b - a)); }
  const p = t.split(":"); return p.length === 2 ? +p[0] * 60 + +p[1] : +t;
}
function spark(years) {
  const ys = DATA.meta.years.map(String), vals = ys.map(y => toSec(years?.[y]));
  const pts = vals.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (pts.length < 2) return `<span class="zero">—</span>`;
  const lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1])), W = 104, H = 30, pad = 4;
  const X = i => pad + i * (W - 2 * pad) / (ys.length - 1), Y = v => hi === lo ? H / 2 : pad + (v - lo) / (hi - lo) * (H - 2 * pad);
  const d = pts.map((p, k) => (k ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  const area = d + ` L${X(last[0]).toFixed(1)} ${H} L${X(pts[0][0]).toFixed(1)} ${H} Z`;
  const tip = ys.map((y, i) => vals[i] != null ? `${y}: ${years[y]}` : null).filter(Boolean).join(" · ");
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mejor marca por año"><title>${esc(tip)}</title>
    <path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3.2" fill="var(--accent)"/></svg>`;
}
const delta = v => v == null ? `<span class="zero">—</span>` : `<span class="delta ${v > 0.05 ? "up" : v < -0.05 ? "down" : "flat"}">${v > 0 ? "+" : ""}${v.toFixed(1)}%</span>`;
const pbOf = (ev, r) => ev.metric === "single" ? r.pbS : r.pbA;
const name = id => PERS[id]?.name || id;
/* Favorito = mejor español inscrito (es el Campeonato de España); si no hay ninguno, el mejor general. */
const favOf = e => e.rows.find(r => r.seedES === 1) || e.rows[0];

/* ---------------- caster tools: pins, notes, key facts ---------------- */
const PINS = new Set(store.get("pins", []).filter(id => PERS[id]));
const NOTES = store.get("notes", {});
const starBtn = id => `<button class="star" data-pin="${id}" aria-pressed="${PINS.has(id)}" aria-label="Fijar competidor" title="Fijar competidor (F)">${PINS.has(id) ? "★" : "☆"}</button>`;
const marks = id => (PINS.has(id) ? ` <span class="mark" title="Fijado">★</span>` : "") + (NOTES[id] ? ` <span class="mark n" title="Tiene notas">✎</span>` : "");
function togglePin(id) {
  PINS.has(id) ? PINS.delete(id) : PINS.add(id); store.set("pins", [...PINS]);
  document.querySelectorAll(`[data-pin="${id}"]`).forEach(x => { x.setAttribute("aria-pressed", PINS.has(id)); x.textContent = PINS.has(id) ? "★" : "☆"; });
  const pt = $('[data-nat][data-v="pin"]'); if (pt) pt.textContent = `★ Fijados (${PINS.size})`;
  if (S.nat === "pin" && $("#evtable")) { drawEvTable(EVBYID[S.ev]); avFix(); }
}
document.addEventListener("click", ev => {
  const b = ev.target.closest?.("[data-pin]"); if (!b) return;
  ev.stopPropagation(); ev.preventDefault(); togglePin(b.dataset.pin);
}, true);
const fmtDiff = x => x < 60 ? x.toFixed(2) + " s" : Math.floor(x / 60) + ":" + (x % 60).toFixed(2).padStart(5, "0");
const listEs = a => a.length > 1 ? a.slice(0, -1).join(", ") + " y " + a.at(-1) : a[0] || "";
const pct = v => v.toFixed(1).replace(".", ",") + " %";
/* Frases cortas, listas para decir en directo, a partir de los datos del competidor. */
function facts(p) {
  const F = [], fem = p.gender === "f", es = p.iso === "ES";
  const rows = p.events.filter(e => EVBYID[e] && ROW[p.id]?.[e]).map(e => [EVBYID[e], ROW[p.id][e]]);
  const names = L => listEs(L.map(([e]) => e.name));
  const def = rows.filter(([e]) => e.champ2025.es === p.id);
  if (def.length) F.push(`Defiende el título de ${fem ? "campeona" : "campeón"} de España en ${names(def)}.`);
  if (p._titles) {
    const by = {}; p.es.pod.filter(x => x[2] === 1).forEach(x => (by[x[0]] ||= []).push(x[1]));
    F.push(`${p._titles} ${p._titles > 1 ? "títulos" : "título"} de España: ${Object.entries(by).map(([ev, ys]) => `${ev} (${ys.sort().join(", ")})`).join("; ")}.`);
  }
  if (p.nrv?.length) F.push(`Récord nacional vigente${es ? "" : " de " + p.country}: ${p.nrv.join(", ")}.`);
  const s1 = rows.filter(([, r]) => r.seed === 1);
  if (s1.length) F.push(`Nº 1 del psych sheet en ${names(s1)}.`);
  if (es) {
    const best = rows.filter(([, r]) => r.seedES === 1 && r.seed !== 1);
    if (best.length) F.push(`${fem ? "Mejor española inscrita" : "Mejor español inscrito"} en ${names(best)}.`);
    const t3 = rows.filter(([, r]) => r.seedES === 2 || r.seedES === 3);
    if (t3.length) F.push(`Aspirante al podio en ${listEs(t3.map(([e, r]) => `${e.name} (${r.seedES}º español)`))}.`);
  } else {
    const t3 = rows.filter(([, r]) => r.seed === 2 || r.seed === 3);
    if (t3.length) F.push(`Top 3 del psych sheet en ${listEs(t3.map(([e, r]) => `${e.name} (${r.seed}º)`))}.`);
  }
  for (const [k, lab] of [["wc", "el Mundial"], ["eu", "el Europeo"]])
    if (p[k]?.pod?.length) F.push(`Podios en ${lab}: ${p[k].pod.map(x => `${x[2]}º en ${x[0]} (${x[1]})`).join(", ")}.`);
  const fresh = rows.filter(([e, r]) => r.b12 && r.b12 === pbOf(e, r));
  if (fresh.length) F.push(`Llega en forma: PB de los últimos 12 meses en ${fresh.length > 4 ? `${fresh.length} de sus ${rows.length} eventos` : names(fresh)}.`);
  const imp = rows.filter(([, r]) => r.iy >= 3).sort((a, b) => b[1].iy - a[1].iy)[0];
  if (imp) F.push(`Mayor progresión: ${imp[0].name}, mejora del ${pct(imp[1].iy)} respecto al año anterior.`);
  if (p.es) {
    const prev = p.es.years.filter(y => y < +DATA.meta.start.slice(0, 4));
    F.push(prev.length ? `${prev.length + 1}.ª participación en el Campeonato de España (la primera, en ${Math.min(...prev)}).` : "Primer Campeonato de España.");
  }
  if (!es) F.push(`No opta al título de España: compite por ${p.country}.`);
  return F;
}

/* ---------------- state & routing ---------------- */
const S = { ev: store.get("ev", DATA.events[0].id), nat: store.get("nat", "all"), lim: store.get("lim", 20), sort: null, evq: "",
            q: "", pNat: "all", pIso: "", pEv: "", pFlags: new Set(), pSort: "seed", palEv: "", palHere: false, cmpMode: false, cmp: [], navList: [], cur: null };
function go(hash) { if (location.hash !== "#" + hash) location.hash = hash; else render(); }
window.addEventListener("hashchange", render);
document.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => go(b.dataset.nav === "evento" ? "evento-" + S.ev : b.dataset.nav)));

function render() {
  const h = location.hash.slice(1) || "inicio";
  let sec = h.split("-")[0];
  if (sec === "c") { const id = h.slice(2); if (PERS[id]) openProfile(id, false); sec = store.get("lastSec", "inicio"); }
  else closeProfile(false);
  if (sec === "evento") { const id = h.slice(7); if (EVBYID[id]) { S.ev = id; store.set("ev", id); } }
  document.querySelectorAll("[data-nav]").forEach(b => b.setAttribute("aria-current", b.dataset.nav === sec ? "page" : "false"));
  if (sec !== "c") store.set("lastSec", sec);
  const v = $("#view"); v.scrollTop = 0;
  ({ inicio: viewHome, evento: viewEvent, competidores: viewPeople, palmares: viewPal }[sec] || viewHome)(v);
  avFix();
}

/* ---------------- home ---------------- */
function viewHome(v) {
  const k = DATA.meta.kpis;
  v.innerHTML = `
    <div class="hero">
      <img class="lg-dark" src="__IMG_logo-h-dark__" alt="Campeonato de España · Espainiako Txapelketa 2026"><img class="lg-light" src="__IMG_logo-h-light__" alt="Campeonato de España · Espainiako Txapelketa 2026">
      <div class="txt"><div class="eyebrow">5 – 7 diciembre 2026 · Datos WCA a ${new Date(DATA.meta.updated).toLocaleDateString("es-ES")}</div>
      <h1>Resumen del campeonato</h1></div>
    </div>
    <div class="kpis">
      <div class="kpi"><b>${k.competitors}</b><span>competidores<br>inscritos</span></div>
      <div class="kpi"><b>${k.countries}</b><span>países</span></div>
      <div class="kpi"><b>${k.newcomers}</b><span>debutantes<br>sin WCA ID</span></div>
      <div class="kpi"><b>${k.events}</b><span>eventos</span></div>
      <div class="kpi"><b>${k.defend}<small style="font-size:calc(22px * var(--fz));color:var(--muted)">/${k.events}</small></b><span>campeones 2025<br>defienden título</span></div>
    </div>
    ${PINS.size ? `<div class="sect" style="margin:0 0 22px"><h2>★ Fijados</h2><div class="pgrid">${[...PINS].map(id => pCard(PERS[id])).join("")}</div></div>` : ""}
    <div class="evgrid">${DATA.events.map(evCard).join("")}</div>`;
  S.navList = [...PINS];
  v.querySelectorAll(".pcard").forEach(c => c.addEventListener("click", () => openProfile(c.dataset.id)));
  v.querySelectorAll(".evcard").forEach(c => c.addEventListener("click", () => go("evento-" + c.dataset.ev)));
}
function evCard(e) {
  const top = e.rows[0], f = favOf(e), c = e.champ2025;
  const nrs = e.rows.filter(r => r.seed <= 20 && r.nrv.length).length;
  return `<button class="evcard" data-ev="${e.id}" style="--evc:${EVC[e.id]}">

    <div class="phead">${av(p)}<div style="min-width:0"><div class="eyebrow">${p.newcomer ? "Debutante" : esc(p.id)}</div><h1>${esc(p.name)}</h1>
      <div class="line">${cc(p.iso)} ${esc(p.country)} ${p.debut ? `· compite desde ${p.debut}` : ""} ${p.url ? `· <a href="${esc(p.url)}" target="_blank" rel="noopener">Perfil WCA ↗</a>` : ""}</div></div>
      <div class="pbtns">${ni >= 0 && nav.length > 1 ? `<span class="count" style="margin:0">${ni + 1} / ${nav.length}</span><button class="iconbtn" id="prevP" aria-label="Competidor anterior" title="Anterior (←)">${chev(-1)}</button><button class="iconbtn" id="nextP" aria-label="Competidor siguiente" title="Siguiente (→)">${chev(1)}</button>` : ""}
        ${starBtn(id)}<button class="iconbtn" id="closeP" aria-label="Cerrar ficha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
    ${!p.medals ? `<p class="note" style="font-size:calc(15px * var(--fz))">${p.newcomer ? "Primera competición oficial: todavía no tiene resultados WCA" : "Sin datos WCA descargados"}. Inscrito en ${p.events.map(e => EVBYID[e]?.name || e).join(", ")}.</p>` : `
    <div class="tiles">
      <div class="tile"><b>${p.comps}</b><span>competiciones</span></div>
      <div class="tile"><b>${(p.solves || 0).toLocaleString("es-ES")}</b><span>solves oficiales</span></div>
      <div class="tile"><div class="medals"><em class="m1">${p.medals[0]}</em><em class="m2">${p.medals[1]}</em><em class="m3">${p.medals[2]}</em></div><span>medallas WCA (oro · plata · bronce)</span></div>
      <div class="tile"><b>${p.records[0]}<small style="font-size:calc(16px * var(--fz));color:var(--muted)"> NR</small> ${p.records[1]}<small style="font-size:calc(16px * var(--fz));color:var(--muted)"> ER</small> ${p.records[2]}<small style="font-size:calc(16px * var(--fz));color:var(--muted)"> WR</small></b><span>récords batidos</span></div>
      <div class="tile"><b style="color:var(--accent)">${p._titles}</b><span>títulos de Campeón de España</span></div>
    </div>
    ${F.length ? `<div class="box"><div class="eyebrow">Datos clave para el directo</div><ul class="facts">${F.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    <div class="sect"><h2>En este campeonato</h2>
      <div class="tablewrap ptable"><table><thead><tr><th class="l">Evento</th><th>Seed</th><th>ESP</th><th>Single</th><th>Media</th><th>Mejor 12 m</th><th>Δ año</th><th>Evolución</th><th>Títulos</th><th>Mejor puesto</th></tr></thead><tbody>
      ${evs.map(({ e, r }) => r ? `<tr data-ev="${e.id}"><td class="l"><b>${esc(e.name)}</b></td><td class="seed" style="font-size:calc(20px * var(--fz))">${r.seed}</td><td class="seedes">${r.seedES || ""}</td>
        <td class="${e.metric === "single" ? "key" : ""}"><span class="t">${esc(r.pbS || "—")}</span></td><td class="${e.metric !== "single" ? "key" : ""}"><span class="t">${esc(r.pbA || "—")}</span></td>
        <td><span class="t">${esc(r.b12 || "—")}</span></td><td>${delta(r.iy)}</td><td>${spark(r.years)}</td><td>${r.tit ? `<span class="tit">${r.tit}</span>` : `<span class="zero">0</span>`}</td><td>${r.bp ? r.bp + "º" : "—"}</td></tr>`
        : `<tr><td class="l"><b>${esc(e.name)}</b></td><td colspan="9" class="zero">Primera vez en este evento</td></tr>`).join("")}
      </tbody></table></div><div class="note">Toca un evento para abrir su clasificación.</div></div>
    <div class="sect cols3">
      <div class="box"><div class="eyebrow">Campeonato de España · ${p.es.years.length} ediciones</div>${podsHtml(p.es.pod)}<div class="yrs">${p.es.years.map(y => `<span>${y}</span>`).join("")}</div></div>
      <div class="box"><div class="eyebrow">Campeonato de Europa · ${p.eu.years.length} ediciones</div>${podsHtml(p.eu.pod)}<div class="yrs">${p.eu.years.map(y => `<span>${y}</span>`).join("")}</div></div>
      <div class="box"><div class="eyebrow">Mundial · ${p.wc.years.length} ediciones</div>${podsHtml(p.wc.pod)}<div class="yrs">${p.wc.years.map(y => `<span>${y}</span>`).join("")}</div></div>
    </div>`}
    <div class="sect"><h2>Notas del caster</h2>
      <textarea class="notes" id="pnote" placeholder="Pronunciación del nombre, anécdotas, qué contar en directo…" aria-label="Notas del caster">${esc(NOTES[id] || "")}</textarea>
      <div class="note">Se guardan solas, solo en este dispositivo. Quien tiene notas aparece marcado con ✎.</div></div>`;
  $("#pnote").addEventListener("input", ev => { if (ev.target.value.trim()) NOTES[id] = ev.target.value; else delete NOTES[id]; store.set("notes", NOTES); });
  $("#prevP")?.addEventListener("click", () => stepProfile(-1));
  $("#nextP")?.addEventListener("click", () => stepProfile(1));
  d.hidden = false; $("#scrim").hidden = false; d.scrollTop = 0; avFix();
  $("#closeP").addEventListener("click", () => closeProfile());
  d.querySelectorAll("tr[data-ev]").forEach(tr => tr.addEventListener("click", () => { closeProfile(false); go("evento-" + tr.dataset.ev); }));
  if (push && location.hash !== "#c-" + id) history.pushState(null, "", "#c-" + id);
}
function stepProfile(dir) {
  const nav = S.navList || [], i = nav.indexOf(S.cur); if (i < 0 || nav.length < 2) return;
  const id = nav[(i + dir + nav.length) % nav.length]; openProfile(id, false);
  if (location.hash.startsWith("#c-")) history.replaceState(null, "", "#c-" + id); else history.pushState(null, "", "#c-" + id);
}
function closeProfile(back = true) {
  if ($("#drawer").hidden) return;
  $("#drawer").hidden = true; $("#scrim").hidden = true;
  if (back && location.hash.startsWith("#c-")) history.back();
}
$("#scrim").addEventListener("click", () => closeProfile());

/* ---------------- palmarés ---------------- */
function viewPal(v) {
  const evs = [...new Set(DATA.palmares.map(x => x.ev))];
  v.innerHTML = `<h1>Palmarés del Campeonato de España</h1>
    <div class="controls"><div class="chips" style="flex:1">${["", ...evs].map(e => `<button class="chip" data-pe="${e}" aria-pressed="${S.palEv === e}">${e || "Todos los eventos"}</button>`).join("")}</div></div>
    <div class="filters" style="margin-bottom:12px"><button class="fchip" id="palHere" aria-pressed="${S.palHere}">Solo podios con inscritos de 2026</button><span class="note" style="margin:0">Podio entre españoles en la final de cada evento. En amarillo, quien compite este año.</span></div>
    <div class="tablewrap paltable"><table><thead><tr><th>Año</th><th class="l">Evento</th><th class="l">🥇 Oro</th><th class="l">🥈 Plata</th><th class="l">🥉 Bronce</th></tr></thead><tbody id="palb"></tbody></table></div>`;
  const draw = () => {
    const L = DATA.palmares.filter(x => (!S.palEv || x.ev === S.palEv) && (!S.palHere || x.pod.some(p => p.here)));
    $("#palb").innerHTML = L.map(x => `<tr style="cursor:default"><td class="yearcell">${x.y}</td><td class="l"><b>${esc(x.ev)}</b></td>${[0, 1, 2].map(i => { const p = x.pod[i];
      return p ? `<td class="l ${p.here ? "here" : ""}" ${p.here ? `data-id="${p.id}" style="cursor:pointer"` : ""}>${esc(p.name)}</td>` : "<td></td>"; }).join("")}</tr>`).join("");
    $("#palb").querySelectorAll("td[data-id]").forEach(td => td.addEventListener("click", () => openProfile(td.dataset.id)));
  };
  v.querySelectorAll("[data-pe]").forEach(b => b.addEventListener("click", () => { S.palEv = b.dataset.pe; v.querySelectorAll("[data-pe]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); }));
  $("#palHere").addEventListener("click", e => { S.palHere = !S.palHere; e.target.setAttribute("aria-pressed", S.palHere); draw(); });
  draw();
}

/* ---------------- global search ---------------- */
const gq = $("#gq"), sug = $("#suggest"); let sel = 0, hits = [];
function drawSug() {
  const q = norm(gq.value.trim());
  hits = q ? DATA.persons.filter(p => p._q.includes(q)).sort((a, b) => (norm(a.name).startsWith(q) ? 0 : 1) - (norm(b.name).startsWith(q) ? 0 : 1) || a._bestSeed - b._bestSeed).slice(0, 8) : [];
  sug.hidden = !hits.length; sel = 0;
  sug.innerHTML = hits.map((p, i) => `<button data-id="${p.id}" class="${i === sel ? "on" : ""}">${av(p)}<span style="flex:1;min-width:0"><b>${esc(p.name)}</b><br><span style="color:var(--muted);font-size:calc(12px * var(--fz))">${esc(p.country)} · ${p.newcomer ? "Debutante" : esc(p.id)}</span></span>${cc(p.iso)}</button>`).join("");
  sug.querySelectorAll("button").forEach(b => b.addEventListener("mousedown", e => { e.preventDefault(); pick(b.dataset.id); }));
  avFix();
}
function pick(id) { gq.value = ""; sug.hidden = true; gq.blur(); openProfile(id); }
gq.addEventListener("input", drawSug);
gq.addEventListener("blur", () => setTimeout(() => sug.hidden = true, 120));
gq.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length; sug.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === sel)); }
  else if (e.key === "Enter" && hits[sel]) pick(hits[sel].id);
  else if (e.key === "Escape") { gq.value = ""; sug.hidden = true; gq.blur(); }
});
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName), open = !$("#drawer").hidden;
  if (e.key === "Escape" && open) return closeProfile();
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); gq.focus(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    const dir = e.key === "ArrowRight" ? 1 : -1;
    if (open) { e.preventDefault(); stepProfile(dir); }
    else if (location.hash.startsWith("#evento")) { e.preventDefault(); const L = DATA.events, i = L.findIndex(x => x.id === S.ev); S.sort = null; go("evento-" + L[(i + dir + L.length) % L.length].id); }
  }
  else if ((e.key === "f" || e.key === "F") && open && S.cur) togglePin(S.cur);
});

/* ---------------- theme, brand, wake lock ---------------- */
const root = document.documentElement;
const savedTheme = store.get("theme", null); if (savedTheme) root.dataset.theme = savedTheme;
$("#themeBtn").addEventListener("click", () => {
  const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  root.dataset.theme = cur === "dark" ? "light" : "dark"; store.set("theme", root.dataset.theme);
});
if (store.get("big", false)) root.dataset.big = "1";
$("#bigBtn").setAttribute("aria-pressed", !!root.dataset.big);
$("#bigBtn").addEventListener("click", () => { const on = !root.dataset.big; if (on) root.dataset.big = "1"; else delete root.dataset.big; store.set("big", on); $("#bigBtn").setAttribute("aria-pressed", on); });
$("#brandSub").textContent = `Campeonato de España 2026 · ${DATA.meta.kpis.competitors} competidores · ${DATA.meta.kpis.events} eventos`;
async function wake() { try { await navigator.wakeLock?.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); }); wake();
render();
</script>
