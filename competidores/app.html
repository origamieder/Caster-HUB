<title>Cto. España 2026 · Competidores</title>
<meta name="theme-color" content="#0D1330">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* App para competidores del Campeonato de España 2026. Mismo sistema visual que Caster Hub (paleta del logo),
   pensada para el móvil en vertical: barra de secciones abajo, una vista con scroll y hojas modales. */
:root {
  --bg: #0D1330; --panel: #141C40; --panel2: #1B2550; --line: #2B3767; --fg: #EEF1F8; --muted: #9CA6C6; --dim: #66719C;
  --accent: #F39200; --accent-ink: #1E1000; --red: #E8424E; --green: #22B866; --blue: #8EA2EE;
  --b-green: #12A04A; --b-orange: #F39200; --b-red: #D3202F; --b-navy: #5A72D0;
  --up-bg: rgba(34,184,102,.16); --down-bg: rgba(232,66,78,.16); --shadow: 0 12px 40px rgba(0,0,0,.5);
  --card: rgba(20, 28, 68, .70); --card-line: rgba(80, 98, 170, .32); --logo-dark: block; --logo-light: none;
  --bg-grad: radial-gradient(60% 40% at 92% 2%, rgba(243,146,0,.40), transparent 100%),
             radial-gradient(55% 45% at 0% 45%, rgba(0,139,59,.36), transparent 100%),
             radial-gradient(60% 40% at 55% 104%, rgba(179,13,27,.36), transparent 100%),
             linear-gradient(160deg, #1E2E80 0%, #142062 45%, #0F1848 100%);
  --nav-bg: rgba(16, 23, 58, .94);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-time: "JetBrains Mono", "Cascadia Mono", Consolas, "Roboto Mono", monospace;
  --barh: 64px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F3F4F9; --panel: #FFFFFF; --panel2: #ECEEF6; --line: #D6DAE8; --fg: #1A2350; --muted: #535D84; --dim: #8D94B2;
  --accent: #B96A00; --accent-ink: #FFFFFF; --red: #B30D1B; --green: #00803A; --blue: #25346C;
  --b-green: #008B3B; --b-orange: #F39200; --b-red: #B30D1B; --b-navy: #25346C;
  --up-bg: rgba(0,139,59,.12); --down-bg: rgba(179,13,27,.10); --shadow: 0 12px 40px rgba(37,52,108,.18);
  --card: rgba(255,255,255,.82); --card-line: rgba(37,52,108,.14); --logo-dark: none; --logo-light: block;
  --bg-grad: radial-gradient(60% 40% at 92% 2%, rgba(243,146,0,.26), transparent 100%),
             radial-gradient(55% 45% at 0% 45%, rgba(0,139,59,.18), transparent 100%),
             radial-gradient(60% 40% at 55% 104%, rgba(179,13,27,.16), transparent 100%),
             linear-gradient(160deg, #FFFFFF 0%, #F1F3FA 50%, #E9ECF6 100%);
  --nav-bg: rgba(255,255,255,.95); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #F3F4F9; --panel: #FFFFFF; --panel2: #ECEEF6; --line: #D6DAE8; --fg: #1A2350; --muted: #535D84; --dim: #8D94B2;
  --accent: #B96A00; --accent-ink: #FFFFFF; --red: #B30D1B; --green: #00803A; --blue: #25346C;
  --b-green: #008B3B; --b-orange: #F39200; --b-red: #B30D1B; --b-navy: #25346C;
  --up-bg: rgba(0,139,59,.12); --down-bg: rgba(179,13,27,.10); --shadow: 0 12px 40px rgba(37,52,108,.18);
  --card: rgba(255,255,255,.82); --card-line: rgba(37,52,108,.14); --logo-dark: none; --logo-light: block;
  --bg-grad: radial-gradient(60% 40% at 92% 2%, rgba(243,146,0,.26), transparent 100%),
             radial-gradient(55% 45% at 0% 45%, rgba(0,139,59,.18), transparent 100%),
             radial-gradient(60% 40% at 55% 104%, rgba(179,13,27,.16), transparent 100%),
             linear-gradient(160deg, #FFFFFF 0%, #F1F3FA 50%, #E9ECF6 100%);
  --nav-bg: rgba(255,255,255,.95); color-scheme: light; }

html, body { height: 100%; }
body { margin: 0; background-color: var(--bg); background-image: var(--bg-grad); background-attachment: fixed; color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.t { font-family: var(--f-time); font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
h1, h2, h3 { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; line-height: 1; }
h2 { font-size: 22px; margin: 22px 0 10px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.lg-dark { display: var(--logo-dark); } .lg-light { display: var(--logo-light); }

/* shell */
.top { position: sticky; top: 0; z-index: 5; background: var(--nav-bg); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--card-line); }
.brandbar { height: 4px; display: grid; grid-template-columns: repeat(4, 1fr); }
.brandbar i:nth-child(1) { background: var(--b-green); } .brandbar i:nth-child(2) { background: var(--b-navy); }
.brandbar i:nth-child(3) { background: var(--b-red); } .brandbar i:nth-child(4) { background: var(--b-orange); }
.topin { display: flex; align-items: center; gap: 10px; padding: 8px 16px; min-height: 56px; }
.topin .ttl { flex: 1; min-width: 0; line-height: 1.1; }
.topin .ttl b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topin .ttl span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 42px; height: 42px; border-radius: 21px; border: 1px solid var(--line); background: var(--panel2); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn.spin svg { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.view { padding: 16px 16px calc(var(--barh) + 28px + env(safe-area-inset-bottom, 0px)); max-width: 980px; margin: 0 auto; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around; background: var(--nav-bg);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--card-line); padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px)); }
.nav button { flex: 1; max-width: 140px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px;
  color: var(--muted); font-size: 11px; font-weight: 600; border-radius: 12px; min-height: 54px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--panel2); }

/* building blocks */
.card { background: var(--card); border: 1px solid var(--card-line); border-radius: 16px; padding: 14px 16px; }
.card + .card { margin-top: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel2); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.pill.ok { background: var(--up-bg); color: var(--green); border-color: transparent; }
.pill.no { background: var(--down-bg); color: var(--red); border-color: transparent; }
.pill.acc { background: var(--accent); color: var(--accent-ink); border: 0; }
.cc { font-family: var(--f-time); font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.cc.es { background: #C8102E; color: #FFD43B; border-color: #C8102E; }
.av { width: 40px; height: 40px; border-radius: 50%; flex: none; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; position: relative;
  font-family: var(--f-display); font-weight: 700; font-size: 16px; color: var(--muted); }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; margin: 0 -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.chip i { width: 10px; height: 10px; border-radius: 3px; background: var(--evc); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.toggle { display: inline-flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.toggle button { border: 0; background: none; height: 34px; padding: 0 12px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
.toggle button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.field { height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel); padding: 0 16px; width: 100%; font-size: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }

/* home */
.hero { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
.hero img { height: 84px; width: auto; max-width: 100%; }
.me-card { display: flex; gap: 14px; align-items: center; }
.me-card .av { width: 60px; height: 60px; font-size: 22px; }
.next { border-left: 5px solid var(--accent); }
.big-t { font-family: var(--f-display); font-size: 28px; font-weight: 800; line-height: 1.05; }
.evtiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.evtile { text-align: left; background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; padding: 10px 12px; position: relative; overflow: hidden; }
.evtile::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--evc); }
.evtile b { display: block; font-family: var(--f-display); font-size: 20px; text-transform: uppercase; }
.evtile span { font-size: 12px; color: var(--muted); }
.evtile.mine { border-color: var(--accent); }
.links { display: grid; gap: 8px; }
.links a { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); }

/* schedule */
.act { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.act:last-child { border-bottom: 0; }
.act .hr { font-family: var(--f-time); font-size: 14px; font-weight: 700; }
.act .hr small { display: block; color: var(--dim); font-weight: 500; font-size: 12px; }
.act .nm { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.act .room { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.act .room i { width: 9px; height: 9px; border-radius: 50%; background: var(--rc, var(--dim)); }
.act.now { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 16%, transparent), transparent); margin: 0 -16px; padding-inline: 16px; }
.act.past { opacity: .5; }
.act.other { opacity: .62; }
.asg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.asg .pill { height: 24px; font-size: 12px; }
.groups { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* event / psych sheet */
.evhead { border-left: 6px solid var(--evc); padding-left: 12px; margin: 6px 0 12px; }
.rounds { width: 100%; border-collapse: collapse; font-size: 13px; }
.rounds th { text-align: left; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 6px 6px; border-bottom: 1px solid var(--line); }
.rounds td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rounds tr:last-child td { border-bottom: 0; }
.psych { list-style: none; margin: 0; padding: 0; }
.psych li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.psych li:last-child { border-bottom: 0; }
.psych .pos { font-family: var(--f-display); font-size: 22px; font-weight: 800; text-align: center; color: var(--muted); }
.psych li.me { background: color-mix(in srgb, var(--accent) 18%, transparent); border-radius: 10px; }
.psych li.me .pos { color: var(--accent); }
.psych .tm { text-align: right; }
.psych .tm .t { font-size: 16px; font-weight: 700; display: block; }
.psych .tm small { color: var(--muted); font-family: var(--f-time); font-size: 12px; }
.psych .nm { font-weight: 700; }
.psych .sub { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

/* people */
.plist { display: grid; gap: 8px; }
.prow { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; padding: 10px 12px; }
.prow .nm { font-weight: 700; }
.prow .sub { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

/* profile */
.phead { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.phead .av { width: 76px; height: 76px; font-size: 28px; border-width: 3px; }
.phead h1 { font-size: 30px; }
.pbtab { width: 100%; border-collapse: collapse; }
.pbtab th { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
.pbtab th:first-child, .pbtab td:first-child { text-align: left; }
.pbtab td { padding: 9px 4px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
.pbtab tr:last-child td { border-bottom: 0; }
.pbtab td .t { font-size: 15px; font-weight: 700; }
.pbtab td small { display: block; color: var(--muted); font-size: 11px; }
.pbtab tr[data-ev] { cursor: pointer; }
.target { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 14px; align-items: center; }
.target + .target { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.target .ev { font-family: var(--f-display); font-size: 20px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.target .ev i { width: 10px; height: 10px; border-radius: 3px; background: var(--evc); }
.target .k { text-align: right; }
.target .k small { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.target .k .t { font-size: 19px; font-weight: 700; color: var(--accent); }
.target .k .t.none { color: var(--dim); }
.target .was { grid-column: 1 / -1; font-size: 12px; color: var(--green); }
.sheets { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 1 / -1; }
.sheetbtn { height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); padding: 0 10px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.sheetbtn .t { font-size: 13px; }
.sheetbtn.done { border-color: var(--green); }
.sheetbtn.pb { border-color: var(--accent); color: var(--accent); }

/* ===== WCA-style scorecard: paper look in both themes ===== */
.paper { background: #FFFFFF; color: #111; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.08); padding: 14px 14px 12px;
  font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; max-width: 520px; margin: 0 auto; }
.paper .comp { text-align: center; font-weight: 700; font-size: 15px; }
.paper .evr { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 6px; }
.paper .evr b { font-size: 21px; }
.paper .evr span { font-size: 14px; }
.paper .idbox { display: grid; grid-template-columns: 64px minmax(0, 1fr); border: 2px solid #111; margin-top: 8px; }
.paper .idbox > div { padding: 4px 8px; }
.paper .idbox > div:first-child { border-right: 2px solid #111; text-align: center; }
.paper .idbox small { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #555; }
.paper .idbox b { font-size: 18px; }
.paper .idbox .nm { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.paper table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
.paper th { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #333; padding: 4px; border: 1px solid #111; background: #F1F1F1; }
.paper td { border: 1px solid #111; height: 52px; text-align: center; padding: 0 4px; }
.paper td.n { font-weight: 700; font-size: 18px; width: 38px; }
.paper td.res { font-family: var(--f-time); font-size: 24px; font-weight: 700; cursor: pointer; position: relative; }
.paper td.res .pen { font-size: 13px; color: #B30D1B; margin-left: 6px; font-weight: 700; }
.paper td.res .raw { display: block; font-size: 11px; color: #777; font-weight: 500; margin-top: -2px; }
.paper td.res.empty::after { content: "Toca para anotar"; font-family: Arial, sans-serif; font-size: 12px; font-weight: 400; color: #B5B5B5; }
.paper td.res.blocked { background: repeating-linear-gradient(-45deg, #F4F4F4 0 6px, #E8E8E8 6px 12px); cursor: not-allowed; }
.paper td.res.blocked::after { content: "No pasa el corte"; font-family: Arial, sans-serif; font-size: 12px; color: #888; font-weight: 400; }
.paper td.res.best { background: #EAF7EF; }
.paper td.res.worst { color: #777; }
.paper td.sig { width: 54px; cursor: pointer; font-size: 22px; color: #1B5FBF; font-family: "Segoe Script", "Bradley Hand", cursive; }
.paper th.n { width: 38px; } .paper th.sig { width: 54px; }
.paper tr.cut td { border: 0; height: auto; padding: 6px 0 5px; }
.paper tr.cut div { border-top: 2px dashed #111; font-size: 12px; font-weight: 700; padding-top: 4px; text-align: center; }
.paper tr.extra td { height: 46px; }
.paper .foot { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; margin-top: 8px; color: #333; flex-wrap: wrap; }
.paper .cur td.res { outline: 3px solid #F39200; outline-offset: -3px; }
.calc { margin-top: 12px; }
.calc .res2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.calc .res2 > div { background: var(--panel2); border-radius: 12px; padding: 8px 12px; }
.calc .res2 b { display: block; font-family: var(--f-time); font-size: 22px; }
.calc .res2 small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.calc ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.calc li::marker { color: var(--accent); }
.calc .pbflag { color: var(--accent); font-weight: 800; }

/* keypad sheet */
.scrim { position: fixed; inset: 0; background: rgba(5,8,14,.55); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--panel); border-radius: 20px 20px 0 0; box-shadow: var(--shadow);
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; max-height: 92vh; overflow-y: auto; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .16s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .6; } } }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
.disp { display: flex; align-items: baseline; justify-content: center; gap: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 76px; }
.disp .t { font-size: 40px; font-weight: 700; }
.disp .pen { font-family: var(--f-display); font-size: 22px; font-weight: 800; color: var(--red); }
.keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.keys button { height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel2); font-size: 24px; font-weight: 600; font-family: var(--f-time); }
.keys button.fn { font-family: var(--f-body); font-size: 15px; font-weight: 700; }

<script>
const BUNDLE = /*__DATA__*/;
const COMP_ID = "SpanishChampionship2026";
const WCIF_URL = `https://www.worldcubeassociation.org/api/v0/competitions/${COMP_ID}/wcif/public`;
const LIVE_URL = `https://live.worldcubeassociation.org/link/competitions/${COMP_ID}`;
const WCA_URL = `https://www.worldcubeassociation.org/competitions/${COMP_ID}`;

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const store = { get(k, d) { try { const v = localStorage.getItem("cmp:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("cmp:" + k, JSON.stringify(v)); return true; } catch (e) { return false; } } };

/* ---------------- WCA helpers ---------------- */
const EV_NAME = { "333": "3x3x3", "222": "2x2x2", "444": "4x4x4", "555": "5x5x5", "666": "6x6x6", "777": "7x7x7", "333bf": "3x3 BLD", "333oh": "3x3 OH",
  clock: "Clock", minx: "Megaminx", pyram: "Pyraminx", skewb: "Skewb", sq1: "Square-1", "444bf": "4x4 BLD", "555bf": "5x5 BLD", "333mbf": "Multi-BLD", "333fm": "FMC" };
const EV_LONG = { "333": "3x3x3 Cube", "222": "2x2x2 Cube", "444": "4x4x4 Cube", "555": "5x5x5 Cube", "666": "6x6x6 Cube", "777": "7x7x7 Cube", "333bf": "3x3x3 Blindfolded",
  "333oh": "3x3x3 One-Handed", clock: "Clock", minx: "Megaminx", pyram: "Pyraminx", skewb: "Skewb", sq1: "Square-1", "444bf": "4x4x4 Blindfolded",
  "555bf": "5x5x5 Blindfolded", "333mbf": "3x3x3 Multi-Blind", "333fm": "3x3x3 Fewest Moves" };
const BY_SINGLE = new Set(["333bf", "444bf", "555bf", "333mbf"]);
const DEFAULT_FMT = { "666": "m", "777": "m", "333bf": "3", "444bf": "3", "555bf": "3", "333mbf": "1", "333fm": "m" };
const FMT = { a: ["Media de 5", 5, "a"], m: ["Media de 3", 3, "m"], "1": ["Mejor de 1", 1, "b"], "2": ["Mejor de 2", 2, "b"], "3": ["Mejor de 3", 3, "b"], "5": ["Mejor de 5", 5, "b"] };
const BRAND = ["var(--b-green)", "var(--b-navy)", "var(--b-red)", "var(--b-orange)"];
const evName = id => EV_NAME[id] || id;
let REGION; try { REGION = new Intl.DisplayNames(["es"], { type: "region" }); } catch (e) {}
const country = iso => { try { return REGION?.of(iso) || iso; } catch (e) { return iso; } };

const cs = c => { // centésimas -> texto
  if (c >= 6000) { const m = Math.floor(c / 6000), r = c - m * 6000; return `${m}:${String(Math.floor(r / 100)).padStart(2, "0")}.${String(r % 100).padStart(2, "0")}`; }
  return (c / 100).toFixed(2);
};
function fmt(v, ev, kind = "s") {
  if (v == null || v === 0) return "";
  if (v === -1) return "DNF"; if (v === -2) return "DNS";
  if (ev === "333mbf") { const dd = Math.floor(v / 1e7), t = Math.floor(v / 100) % 1e5, mm = v % 100, solved = 99 - dd + mm;
    return `${solved}/${solved + mm} ${t === 99999 ? "?" : Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0")}`; }
  if (ev === "333fm") return kind === "a" ? (v / 100).toFixed(2) : String(v);
  return cs(v);
}
const better = (a, b) => a > 0 && (!(b > 0) || a < b); // a mejora a b (menor es mejor; también en Multi-BLD)
const initials = n => n.replace(/\(.*?\)/g, "").trim().split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const av = p => `<span class="av">${esc(initials(p.name))}${p.avatar ? `<img src="${esc(p.avatar)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
const cc = iso => `<span class="cc ${iso === "ES" ? "es" : ""}">${esc(iso)}</span>`;

/* ---------------- data model (from bundled snapshot or a fresh WCIF) ---------------- */
// Same output as tools/export_comp.py. Keep both in sync.
function slim(w) {
  const act = a => ({ id: a.id, name: a.name, activityCode: a.activityCode, startTime: a.startTime, endTime: a.endTime, childActivities: (a.childActivities || []).map(act) });
  const sch = w.schedule || {};
  return {
    v: 1, id: w.id, name: BUNDLE.name, source: "wcif", updated: new Date().toISOString(),
    persons: w.persons.filter(p => p.registration && p.registration.status === "accepted" && p.registration.isCompeting !== false).map(p => ({
      r: p.registrantId, n: p.name, w: p.wcaId || null, c: p.countryIso2, g: p.gender, a: p.avatar?.thumbUrl || null, e: p.registration.eventIds,
      pb: (p.personalBests || []).map(b => [b.eventId, b.type[0], b.best, b.worldRanking ?? null, b.nationalRanking ?? null]),
      asg: (p.assignments || []).map(a => [a.activityId, a.assignmentCode, a.stationNumber ?? null]) })),
    events: w.events.map(e => ({ id: e.id, rounds: (e.rounds || []).map(r => ({ id: r.id, format: r.format, timeLimit: r.timeLimit, cutoff: r.cutoff, advancementCondition: r.advancementCondition })) })),
    schedule: sch.venues?.length ? { startDate: sch.startDate, numberOfDays: sch.numberOfDays, venues: sch.venues.map(v => ({ name: v.name, timezone: v.timezone,
      rooms: (v.rooms || []).map(r => ({ id: r.id, name: r.name, color: r.color, activities: (r.activities || []).map(act) })) })) } : null,
  };
}
let D; // snapshot in use
let M; // indexed model
function build(d) {
  const persons = d.persons.map(x => {
    const pb = {};
    for (const [ev, t, best, wr, nr] of x.pb) (pb[ev] ||= {})[t] = { v: best, wr, nr };
    return { key: x.w || "r" + x.r, rid: x.r, name: x.n, wca: x.w, iso: x.c, gender: x.g, avatar: x.a, events: x.e, pb, asg: x.asg || [], _q: norm(x.n + " " + (x.w || "") + " " + x.r + " " + country(x.c)) };
  });
  const byKey = Object.fromEntries(persons.map(p => [p.key, p]));
  const byRid = Object.fromEntries(persons.map(p => [p.rid, p]));
  const events = d.events.filter(e => EV_NAME[e.id]).map((e, i) => ({ id: e.id, name: evName(e.id), color: BRAND[i % 4], rounds: e.rounds, single: BY_SINGLE.has(e.id) }));
  const evById = Object.fromEntries(events.map(e => [e.id, e]));
  // psych sheet: por media (o single en BLD); quien solo tiene single va detrás; sin marca, al final
  const psych = {};
  for (const e of events) {
    const k = p => { const s = p.pb[e.id]?.s?.v, a = p.pb[e.id]?.a?.v; if (e.single) return s ? [0, s, 0] : [2, 0, 0]; return a ? [0, a, s || 0] : s ? [1, s, 0] : [2, 0, 0]; };
    const L = persons.filter(p => p.events.includes(e.id)).map(p => ({ p, k: k(p) }))
      .sort((x, y) => x.k[0] - y.k[0] || x.k[1] - y.k[1] || x.k[2] - y.k[2] || x.p.name.localeCompare(y.p.name, "es"));
    let es = 0; L.forEach((x, i) => { x.seed = x.k[0] < 2 ? i + 1 : null; if (x.p.iso === "ES" && x.seed) x.seedES = ++es; });
    psych[e.id] = L;
  }
  // horario: actividades planas (con sala y zona horaria) y grupos
  const acts = [], actById = {};
  for (const v of d.schedule?.venues || []) for (const r of v.rooms) for (const a of r.activities) {
    const A = { id: a.id, name: a.name, code: a.activityCode, start: new Date(a.startTime), end: new Date(a.endTime), room: r.name, color: r.color, tz: v.timezone, venue: v.name, groups: [] };
    acts.push(A); actById[a.id] = A;
    for (const c of a.childActivities || []) { const G = { id: c.id, name: c.name, code: c.activityCode, start: new Date(c.startTime), end: new Date(c.endTime), parent: A }; A.groups.push(G); actById[c.id] = G; }
  }
  acts.sort((a, b) => a.start - b.start || a.room.localeCompare(b.room));
  const tz = d.schedule?.venues?.[0]?.timezone || "Europe/Madrid";
  return { persons, byKey, byRid, events, evById, psych, acts, actById, tz, venue: d.schedule?.venues?.[0]?.name || "", hasSchedule: acts.length > 0 };
}
function loadData() {
  const cached = store.get("wcif", null);
  D = cached && cached.v === 1 && (cached.updated || "") > (BUNDLE.updated || "") ? cached : BUNDLE;
  M = build(D);
}
loadData();

/* ---------------- rounds & formats ---------------- */
function roundsOf(evId) {
  const e = M.evById[evId];
  if (e.rounds?.length) return e.rounds.map((r, i) => ({ ...r, n: i + 1, total: e.rounds.length, known: true }));
  // Sin WCIF todavía: formato habitual y tantas rondas como el competidor vaya abriendo.
  const n = Math.max(1, store.get("extraRounds", {})[evId] || 1);
  return Array.from({ length: n }, (_, i) => ({ id: `${evId}-r${i + 1}`, format: DEFAULT_FMT[evId] || "a", timeLimit: null, cutoff: null, advancementCondition: null, n: i + 1, total: null, known: false }));
}
const roundName = r => r.total && r.n === r.total ? "Final" : r.total >= 4 && r.n === r.total - 1 ? "Semifinal" : `Ronda ${r.n}`;
const roundById = id => { const ev = id.split("-r")[0]; return M.evById[ev] && roundsOf(ev).find(r => r.id === id); };
const parseCode = c => { const m = /^([^-]+)-r(\d+)(?:-g(\d+))?/.exec(c || ""); return m ? { ev: m[1], r: +m[2], g: m[3] ? +m[3] : null } : null; };
function limitTxt(r, ev) {
  const tl = r.timeLimit; if (!tl) return ev === "333mbf" ? "10:00 por cubo (máx. 60:00)" : r.known ? "—" : "Pendiente";
  const cum = tl.cumulativeRoundIds?.length;
  return cs(tl.centiseconds) + (cum ? (cum > 1 ? " acumulado entre " + tl.cumulativeRoundIds.map(id => evName(id.split("-r")[0])).join(" + ") : " acumulado") : "");
}
const cutoffTxt = (r, ev) => r.cutoff ? `${r.cutoff.numberOfAttempts} ${r.cutoff.numberOfAttempts > 1 ? "intentos" : "intento"} para bajar de ${fmt(r.cutoff.attemptResult, ev)}` : r.known ? "Sin corte" : "Pendiente";
function advTxt(r) {
  const a = r.advancementCondition; if (!a) return r.known ? (r.n === r.total ? "Final" : "—") : "Pendiente";
  if (a.type === "ranking") return `Pasan los ${a.level} primeros`;
  if (a.type === "percent") return `Pasa el ${a.level} % mejor`;
  if (a.type === "attemptResult") return `Pasa quien baje de ${fmt(a.level, r.id.split("-r")[0])}`;
  return "—";
}

/* ---------------- my results (scoresheets) ---------------- */
// RES[personKey][roundId] = [{t: centis | mbf, p: 0 | 2 | "DNF" | "DNS", j, c}, ...]  (p=+2 se guarda aparte del tiempo marcado)
const RES = store.get("res", {});
let ME = store.get("me", null); if (ME && !M.byKey[ME]) ME = null;
const saveRes = () => store.set("res", RES);
const attempts = (key, rid) => RES[key]?.[rid] || [];
function aVal(a, ev, tl) { // valor WCA de un intento anotado
  if (!a) return 0;
  if (a.p === "DNF") return -1; if (a.p === "DNS") return -2;
  if (ev === "333mbf") return a.t;
  let v = a.t + (a.p === 2 ? 200 : 0);
  if (v >= 60000) v = Math.round(v / 100) * 100; // más de 10 min: al segundo (9f1)
  if (tl && !tl.cumulativeRoundIds?.length && v >= tl.centiseconds) return -1;
  return v;
}
const isDnf = v => v < 0;
function bestOf(vals) { const ok = vals.filter(v => v > 0); return ok.length ? Math.min(...ok) : vals.some(v => v < 0) ? -1 : 0; }
function avgOf(vals, kind, ev) { // vals completos; devuelve media WCA (redondeo a la centésima)
  if (kind === "m") { if (vals.some(isDnf)) return -1; const s = vals.reduce((x, y) => x + y, 0) / vals.length; return ev === "333fm" ? Math.round(s * 100) : rnd(s); }
  const s = vals.map(v => v < 0 ? Infinity : v).sort((x, y) => x - y), mid = s.slice(1, -1);
  if (mid.includes(Infinity)) return -1;
  return rnd(mid.reduce((x, y) => x + y, 0) / mid.length);
}
const rnd = x => x >= 60000 ? Math.round(x / 100) * 100 : Math.round(x);
function summary(key, r) { // estado de una hoja
  const ev = r.id.split("-r")[0], [, n, kind] = FMT[r.format] || FMT.a, A = attempts(key, r.id);
  const vals = Array.from({ length: n }, (_, i) => aVal(A[i], ev, r.timeLimit));
  const filled = vals.filter(v => v !== 0).length;
  const cutN = r.cutoff?.numberOfAttempts || 0;
  const madeCut = !cutN ? true : vals.slice(0, cutN).some(v => v > 0 && v < r.cutoff.attemptResult);
  const cutDone = !cutN || vals.slice(0, cutN).every(v => v !== 0);
  const blocked = cutN && cutDone && !madeCut;
  const total = blocked ? cutN : n;
  const best = bestOf(vals);
  const complete = filled >= total;
  // En BLD al mejor de 3 la WCA también registra la media de 3 si están los tres intentos
  const avg = !complete || blocked ? null : kind !== "b" ? avgOf(vals, kind, ev) : n === 3 && ev !== "333mbf" ? avgOf(vals, "m", ev) : null;
  return { ev, n, kind, vals, filled, cutN, madeCut, blocked, total, best, avg, complete, A };
}
function pbsOf(key, ev) { // PB oficial y lo mejor anotado en el campeonato
  const p = M.byKey[key], off = p?.pb[ev] || {};
  let cs1 = 0, ca = 0, cs1r = null, car = null;
  for (const r of roundsOf(ev)) {
    const s = summary(key, r);
    if (better(s.best, cs1)) { cs1 = s.best; cs1r = r; }
    if (s.avg && better(s.avg, ca)) { ca = s.avg; car = r; }
  }
  const offS = off.s?.v || 0, offA = off.a?.v || 0;
  return { offS, offA, compS: cs1, compA: ca, compSr: cs1r, compAr: car,
           s: better(cs1, offS) ? cs1 : offS, a: better(ca, offA) ? ca : offA, newS: better(cs1, offS), newA: better(ca, offA) };
}
function needFor(target, s, r) { // tiempo máximo en el último intento para que la media mejore 'target'
  if (!(target > 0) || s.kind === "b" || s.blocked || s.filled !== s.total - 1 || s.vals[s.total - 1] !== 0) return null;
  const idx = s.vals.indexOf(0); if (idx !== s.total - 1) return null;
  const withX = x => { const v = s.vals.slice(); v[idx] = x; return avgOf(v, s.kind, s.ev); };
  if (better(withX(-1), target)) return { always: true };
  if (!better(withX(1), target)) return { never: true };
  let lo = 1, hi = 360000; // mayor x que todavía mejora
  while (lo < hi) { const mid = Math.ceil((lo + hi) / 2); if (better(withX(mid), target)) lo = mid; else hi = mid - 1; }
  return { max: lo };
}
function seedWith(ev, v, kind) { // puesto que tendría esa marca en el psych sheet de este evento
  const e = M.evById[ev]; if (!(v > 0)) return null;
  const L = M.psych[ev].filter(x => x.p.key !== ME);
  const k = x => e.single ? x.p.pb[ev]?.s?.v : x.p.pb[ev]?.a?.v;
  if (!e.single && kind === "s") return null;
  return L.filter(x => k(x) > 0 && k(x) < v).length + 1;
}

/* ---------------- routing ---------------- */
const S = { ev: store.get("ev", null), evNat: "all", evq: "", q: "", day: null, mine: store.get("mine", true) };
function go(h) { if (location.hash !== "#" + h) location.hash = h; else render(); }
window.addEventListener("hashchange", render);
$$("[data-nav]").forEach(b => b.addEventListener("click", () => go(b.dataset.nav)));
$("#backBtn").addEventListener("click", () => history.length > 1 ? history.back() : go("inicio"));
function setTop(title, sub, back) {
  $("#ttl").textContent = title; $("#sub").textContent = sub || ""; $("#backBtn").hidden = !back;
}
function render() {
  closeSheet(false);
  const h = decodeURIComponent(location.hash.slice(1)) || "inicio";
  const [sec, ...rest] = h.split("/"); const arg = rest.join("/");
  const navSec = { p: "gente", hoja: "yo", ev: "eventos" }[sec] || sec;
  $$("[data-nav]").forEach(b => b.setAttribute("aria-current", b.dataset.nav === navSec ? "page" : "false"));
  const v = $("#view");
  ({ inicio: viewHome, horario: viewSchedule, eventos: viewEvent, ev: viewEvent, gente: viewPeople, p: viewPerson, yo: viewMe, hoja: viewSheet }[sec] || viewHome)(v, arg);
  window.scrollTo(0, 0);
}
const updatedTxt = () => { const d = new Date(D.updated); return isNaN(d) ? D.updated : d.toLocaleDateString("es-ES", { day: "numeric", month: "short" }) + (D.updated.length > 10 ? " " + d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }) : ""); };

/* ---------------- time helpers for the schedule ---------------- */
const tfmt = (d, o) => d.toLocaleString("es-ES", { timeZone: M.tz, ...o });
const hhmm = d => tfmt(d, { hour: "2-digit", minute: "2-digit" });
const dayKey = d => tfmt(d, { year: "numeric", month: "2-digit", day: "2-digit" });
const dayName = d => { const s = tfmt(d, { weekday: "long", day: "numeric", month: "long" }); return s[0].toUpperCase() + s.slice(1); };
function actTitle(a) {
  const c = parseCode(a.code);
  if (c && M.evById[c.ev]) { const r = roundsOf(c.ev).find(x => x.n === c.r); return `${evName(c.ev)} · ${r ? roundName(r) : "Ronda " + c.r}${c.g ? " · Grupo " + c.g : ""}`; }
  return a.name;
}
const ROLE = { competitor: "Compites", "staff-judge": "Juez", "staff-scrambler": "Mezclador", "staff-runner": "Runner", "staff-dataentry": "Data entry", "staff-announcer": "Anuncios", "staff-delegate": "Delegado", "staff-organizer": "Organización" };
const roleName = c => ROLE[c] || (c || "").replace(/^staff-/, "Staff: ");
function myAsg(p) { // [{act (grupo o actividad), role, station}]
  return (p?.asg || []).map(([id, code, st]) => ({ act: M.actById[id], role: code, station: st })).filter(x => x.act).sort((a, b) => a.act.start - b.act.start);
}
function nextFor(p) {
  const now = Date.now();
  const L = myAsg(p).filter(x => x.act.end > now);
  if (L.length) return L[0];
  if (!p) return null;
  const a = M.acts.find(a => a.end > now && (c => c && p.events.includes(c.ev))(parseCode(a.code)));
  return a ? { act: a, role: "competitor", station: null, guess: true } : null;
}

}
$("#syncBtn").addEventListener("click", () => sync(false));
document.addEventListener("click", e => { if (e.target.closest?.("[data-sync]")) sync(false); });

/* ---------------- toast, theme, back ---------------- */
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
const root = document.documentElement;
const savedTheme = store.get("theme", null); if (savedTheme) root.dataset.theme = savedTheme;
$("#themeBtn").addEventListener("click", () => {
  const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  root.dataset.theme = cur === "dark" ? "light" : "dark"; store.set("theme", root.dataset.theme);
});
// Botón «atrás» de Android: primero cierra la hoja abierta, luego navega hacia atrás; en Inicio sale de la app.
window.__back = () => {
  if (!$("#sheet").hidden) { closeSheet(); return true; }
  const h = location.hash.slice(1) || "inicio";
  if (h === "inicio") return false;
  if (history.length > 1) { history.back(); return true; }
  go("inicio"); return true;
};

render();
// Sin horario o datos de más de 3 h: intenta actualizar en segundo plano (si no hay internet, no pasa nada).
if (!M.hasSchedule || Date.now() - store.get("lastSync", 0) > 3 * 3600e3) setTimeout(() => sync(true), 800);
</script>
